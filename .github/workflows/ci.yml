name: CI

on:
  push:
  pull_request:
  workflow_call: # 배포 워크플로가 배포 전에 같은 검사를 부른다 (deploy.yml)

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 지원 범위의 최소 버전과 개발 버전
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # v7 이후 메이저 태그(v10)가 없어 정확한 버전으로 고정
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest
