name: 원격 배포

# main에 서버 코드가 바뀌면 CI를 거쳐 Fly.io 원격 서버(M9)를 배포하고, 배포 후 확인이 실패하면
# 직전 이미지로 되돌린 뒤 이슈로 알린다 (docs/기획.md "원격 HTTP 서버 (M9)").
# 데이터만 바뀐 병합(주간 갱신 PR)은 배포하지 않는다. 서버는 기동할 때 최신 검색 DB를 받기 때문이다.
# 필요한 설정: 저장소 시크릿 FLY_API_TOKEN(`fly tokens create deploy`), SONBAE_TOKEN(원격 서버 접속 토큰)
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "!src/sonbae/db_release.json" # 주간 갱신이 바꾸는 고정 DB 버전 정보
      - "Dockerfile"
      - "fly.toml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: fly-deploy
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  ci:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@1.6

      - name: 직전 이미지 기록
        id: previous
        run: |
          app=$(sed -n 's/^app = "\(.*\)"/\1/p' fly.toml)
          echo "app=$app" >> "$GITHUB_OUTPUT"
          image=$(flyctl machine list -a "$app" --json | jq -r '.[0].config.image // empty')
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "직전 이미지: ${image:-없음}"

      - name: 배포
        id: deploy
        # 머신은 1대로 둔다(요청 제한 카운터가 머신마다 따로 있다). 헬스 체크를 통과해야 성공으로 끝난다
        run: flyctl deploy --remote-only --ha=false

      - name: 배포 후 확인
        id: smoke
        env:
          APP: ${{ steps.previous.outputs.app }}
          SONBAE_TOKEN: ${{ secrets.SONBAE_TOKEN }}
        # search는 Voyage 토큰을 써서 부르지 않고, DB만 읽는 get_details로 도구 호출까지 확인한다
        run: |
          base="https://$APP.fly.dev"
          for i in $(seq 1 24); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$base/health" || true)
            [ "$code" = "200" ] && break
            sleep 5
          done
          if [ "$code" != "200" ]; then echo "::error::/health가 200이 아닙니다($code)"; exit 1; fi
          response=$(curl -sS --fail-with-body -X POST "$base/mcp" \
            -H "Authorization: Bearer $SONBAE_TOKEN" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            -H "MCP-Protocol-Version: 2025-06-18" \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"get_details","arguments":{"ids":["case_0001"]}}}')
          if ! echo "$response" | jq -e '.result.isError != true and (.result.content[0].text | length > 0)' > /dev/null; then
            echo "::error::get_details 호출 결과가 올바르지 않습니다"
            exit 1
          fi
          echo "확인 완료: /health 200, get_details 정상"

      - name: 직전 이미지로 되돌리기
        id: rollback
        if: failure() && steps.previous.outputs.image != '' && (steps.deploy.outcome == 'failure' || steps.smoke.outcome == 'failure')
        run: |
          flyctl deploy --image "${{ steps.previous.outputs.image }}" --ha=false
          echo "되돌림 완료: ${{ steps.previous.outputs.image }}"

      - name: 문제 알림 이슈
        if: failure()
        run: |
          body="$RUNNER_TEMP/issue.md"
          {
            echo "원격 배포가 실패했습니다."
            echo
            echo "- 배포: ${{ steps.deploy.outcome || '실행 안 됨' }}"
            echo "- 배포 후 확인: ${{ steps.smoke.outcome || '실행 안 됨' }}"
            echo "- 되돌리기: ${{ steps.rollback.outcome || '실행 안 됨' }} (직전 이미지: ${{ steps.previous.outputs.image || '없음' }})"
            echo "- 커밋: ${{ github.sha }}"
            echo "- 실행 기록: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > "$body"
          gh label create deploy --color B60205 --description "원격 배포 문제 알림" --force
          # 열린 알림 이슈가 있으면 댓글로 이어 붙인다
          number=$(gh issue list --label deploy --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$body"
          else
            gh issue create --title "fix: 원격 배포 실패 확인 필요" --label deploy --body-file "$body"
          fi
