name: 원격 배포

# main에 서버 코드가 바뀌면 CI를 거쳐 Fly.io 원격 서버(M9)를 배포하고, 배포 후 확인이 실패하면
# 직전 이미지로 되돌린 뒤 이슈로 알린다 (docs/기획.md "원격 HTTP 서버 (M9)").
# 데이터만 바뀐 병합(주간 갱신 PR)은 배포하지 않는다. 서버는 기동할 때 최신 검색 DB를 받기 때문이다.
# 필요한 설정: 저장소 시크릿 FLY_API_TOKEN(`fly tokens create deploy`), SONBAE_TOKEN(원격 서버 접속 토큰)
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "!src/sonbae/db_release.json" # 주간 갱신이 바꾸는 고정 DB 버전 정보
      - "Dockerfile"
      - "fly.toml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: fly-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # 실패 알림 이슈
    timeout-minutes: 20
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 되돌릴 때 직전 배포 커밋의 fly.toml을 꺼낸다
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@1.6

      - name: 직전 배포 기록
        id: previous
        # 이미지 태그를 커밋 SHA로 달아(아래 배포 단계) 직전 배포의 fly.toml을 찾는다. 태그가 커밋이 아니면
        # (워크플로 도입 전 로컬 배포) 현재 fly.toml을 쓴다
        run: |
          app=$(sed -n 's/^app = "\(.*\)"/\1/p' fly.toml)
          echo "app=$app" >> "$GITHUB_OUTPUT"
          image=$(flyctl machine list -a "$app" --json | jq -r '.[0].config.image // empty')
          echo "image=$image" >> "$GITHUB_OUTPUT"
          config="$RUNNER_TEMP/previous-fly.toml"
          tag="${image##*:}"
          if [[ "$tag" =~ ^[0-9a-f]{40}$ ]] && git show "$tag:fly.toml" > "$config" 2>/dev/null; then
            echo "직전 배포: $image (커밋 $tag의 fly.toml)"
          else
            cp fly.toml "$config"
            echo "직전 배포: ${image:-없음} (배포 커밋을 알 수 없어 현재 fly.toml 사용)"
          fi
          echo "config=$config" >> "$GITHUB_OUTPUT"

      - name: 배포
        id: deploy
        # 머신은 1대로 둔다(요청 제한 카운터가 머신마다 따로 있다). 헬스 체크를 통과해야 성공으로 끝난다.
        # 멈춰도 되돌리기·알림 단계가 돌 시간을 남기려고 단계 한도를 둔다
        timeout-minutes: 10
        run: flyctl deploy --remote-only --ha=false --image-label "$GITHUB_SHA"

      - name: 배포 후 확인
        id: smoke
        timeout-minutes: 4
        env:
          APP: ${{ steps.previous.outputs.app }}
          SONBAE_TOKEN: ${{ secrets.SONBAE_TOKEN }}
        # search는 Voyage 토큰을 써서 부르지 않는다. DB만 읽는 aggregate에서 지금 있는 항목 ID를 하나 받아
        # (항목 ID는 데이터 갱신으로 바뀔 수 있다) get_details로 그 상세가 실제로 오는지 본다
        run: |
          base="https://$APP.fly.dev"
          for i in $(seq 1 24); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 10 "$base/health" || true)
            [ "$code" = "200" ] && break
            sleep 5
          done
          if [ "$code" != "200" ]; then echo "::error::/health가 200이 아닙니다($code)"; exit 1; fi
          call() {
            jq -nc --arg name "$1" --argjson args "$2" \
              '{jsonrpc: "2.0", id: 1, method: "tools/call", params: {name: $name, arguments: $args}}' |
              curl -sS --fail-with-body --connect-timeout 5 --max-time 30 -X POST "$base/mcp" \
                -H "Authorization: Bearer $SONBAE_TOKEN" \
                -H "Content-Type: application/json" \
                -H "Accept: application/json, text/event-stream" \
                -H "MCP-Protocol-Version: 2025-06-18" \
                --data-binary @-
          }
          id=$(call aggregate '{"group_by": "company", "top_n": 1}' | jq -r '.result.content[0].text // ""' |
            grep -oE 'case_[0-9]+' | head -n 1 || true)
          if [ -z "$id" ]; then echo "::error::aggregate 결과에서 항목 ID를 찾지 못했습니다"; exit 1; fi
          # 없는 ID도 오류가 아닌 안내 문구로 돌아오므로, 요청한 항목의 상세 머리글이 실제로 왔는지 본다
          if ! call get_details "{\"ids\": [\"$id\"]}" |
            jq -e --arg head "[$id]" '.result.isError != true and (.result.content[0].text | contains($head))' > /dev/null; then
            echo "::error::get_details가 $id의 상세를 돌려주지 않았습니다"
            exit 1
          fi
          echo "확인 완료: /health 200, aggregate·get_details 정상 ($id)"

      - name: 직전 배포로 되돌리기
        id: rollback
        if: failure() && steps.previous.outputs.image != '' && (steps.deploy.outcome == 'failure' || steps.smoke.outcome == 'failure')
        timeout-minutes: 5
        env:
          PREVIOUS_IMAGE: ${{ steps.previous.outputs.image }}
          PREVIOUS_CONFIG: ${{ steps.previous.outputs.config }}
        # 이미지와 함께 그때의 fly.toml로 배포해 설정(포트, 헬스 체크 등)도 되돌린다
        run: |
          flyctl deploy --image "$PREVIOUS_IMAGE" --config "$PREVIOUS_CONFIG" --ha=false
          echo "되돌림 완료: $PREVIOUS_IMAGE"

      - name: 문제 알림 이슈
        if: failure()
        env:
          PREVIOUS_IMAGE: ${{ steps.previous.outputs.image || '없음' }}
        run: |
          body="$RUNNER_TEMP/issue.md"
          {
            echo "원격 배포가 실패했습니다."
            echo
            echo "- 배포: ${{ steps.deploy.outcome || '실행 안 됨' }}"
            echo "- 배포 후 확인: ${{ steps.smoke.outcome || '실행 안 됨' }}"
            echo "- 되돌리기: ${{ steps.rollback.outcome || '실행 안 됨' }} (직전 이미지: $PREVIOUS_IMAGE)"
            echo "- 커밋: ${{ github.sha }}"
            echo "- 실행 기록: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > "$body"
          gh label create deploy --color B60205 --description "원격 배포 문제 알림" --force
          # 열린 알림 이슈가 있으면 댓글로 이어 붙인다
          number=$(gh issue list --label deploy --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$body"
          else
            gh issue create --title "fix: 원격 배포 실패 확인 필요" --label deploy --body-file "$body"
          fi
