# Fly.io 원격 MCP 서버 설정 (M9). 결정 사항은 docs/기획.md "원격 HTTP 서버 (M9)"
# 시크릿(SONBAE_TOKEN, VOYAGE_API_KEY)은 이 파일이 아니라 `fly secrets set`으로 넣는다

# 앱 이름은 Fly.io 전체에서 겹치면 안 된다. 다른 이름을 쓰면 여기만 바꾼다
app = "sonbae"
# 도쿄. 국내에서 가깝고, Voyage API 왕복 지연과 함께 배포 후 다른 리전과 비교해 본다
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[env]
  SONBAE_HOST = "0.0.0.0"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  # 실제 사용자를 받지 않고 필요할 때만 켠다: 요청이 없으면 멈추고, 요청이 오면 다시 켠다
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  # 머신 한 대가 동시에 처리할 요청 수. 넘으면 프록시가 다른 머신으로 보내거나 기다리게 한다
  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 50

  # 준비(DB 다운로드·항목 임베딩·형태소 분석기)가 끝난 머신에만 요청을 보낸다.
  # 로컬 컨테이너에서 기동부터 준비 완료까지 17초가 걸려 유예 시간을 넉넉히 둔다
  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"

# 준비를 마친 서버가 약 590MB를 써서 512MB로는 부족하다
[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
