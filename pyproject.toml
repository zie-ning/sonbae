[project]
name = "sonbae"
version = "0.1.0"
description = "국내 IT 기업 기술 블로그의 해결 사례와 실무 인사이트를 코딩 에이전트에 제공하는 MCP 서버"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "zie-ning", email = "jeeun03@gmail.com" }
]
requires-python = ">=3.11"
# MCP 서버 실행에 필요한 의존성만 둔다 (수집·추출용은 pipeline 그룹)
dependencies = [
    "httpx",  # 의미 검색 API(Voyage) 호출
    "kiwipiepy",
    "mcp",
    "numpy",  # 항목 임베딩 코사인 계산
    "uvicorn",  # 원격 서버(M9) HTTP 실행. mcp도 의존하지만 직접 쓰므로 명시
]

[project.scripts]
sonbae = "sonbae.server:main"
sonbae-http = "sonbae.remote:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]
# 수집·추출·색인 빌드용 (배포 패키지에는 포함하지 않음)
pipeline = [
    "beautifulsoup4",
    "httpx",
    "langsmith>=0.14.2",
    "openai",
    "python-dotenv",
]

[tool.uv]
# 파이프라인 파서 테스트도 CI에서 돌도록 기본 동기화에 포함
default-groups = ["dev", "pipeline"]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# 배포 패키지가 아닌 pipeline 모듈을 테스트에서 import하기 위해 루트를 경로에 추가
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
